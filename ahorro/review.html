<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bantrab Ahorro · revisão estática</title><style>*{box-sizing:border-box}body{margin:0;padding:36px;background:#0c0f11;color:#fff;font:14px Arial,sans-serif}h1{margin-top:0}h2{margin-top:36px}.grid{display:flex;flex-wrap:wrap;gap:18px}.tile{padding:12px;background:#1a1d20;border:1px solid #333;border-radius:7px;width:max-content}.tile b{display:block;margin-bottom:10px}iframe{border:0;display:block}.frame-wrap{overflow:hidden}a{color:#84d6d7}</style></head><body><h1>Bantrab Ahorro · cartelas paradas</h1><p>Conferência de enquadramento, margem, texto, foto e marca. <a href="preview.html">Ver animações ↗</a></p><div id="content"></div><script>for(const kind of ['floating','cube']){let section=document.createElement('section');section.innerHTML=`<h2>${kind==='cube'?'3D Cube':'Floating Object'}</h2><div class="grid"></div>`;for(const variant of ['futuro','suenos'])for(const [w,h] of [[300,250],[400,300],[600,400],[1080,1920]])for(const face of (kind==='cube'?['front','offer']:['front'])){let d=document.createElement('div');d.className='tile';d.innerHTML=`<b>${variant} · ${w}×${h} · ${face}</b><div class="frame-wrap" style="width:${w===1080?270:w}px;height:${h===1920?480:h}px"><iframe width="${w}" height="${h}" style="${w===1080?'transform:scale(.25);transform-origin:top left':''}" src="${kind}/${variant}/${w}x${h}/index.html?face=${face}"></iframe></div>`;section.querySelector('.grid').append(d)}document.querySelector('#content').append(section)}</script></body></html>
