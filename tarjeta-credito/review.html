<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Revisão estática · Tarjeta de Crédito</title><style>body{font-family:Arial,sans-serif;margin:0;padding:18px;background:#e9eeec;color:#143437}h1{font-size:22px;margin:0 0 14px}.grid{display:flex;gap:14px;align-items:flex-start}.item{background:#fff;border-radius:8px;padding:8px;box-shadow:0 2px 7px #0002}.item strong{display:block;margin:0 0 7px}.frame{overflow:hidden}iframe{display:block;border:0}</style></head><body><h1>Revisão estática · Tarjeta de Crédito</h1><div class="grid" id="grid"></div><script>document.getElementById('grid').innerHTML=[[300,250],[400,300],[600,400]].map(([w,h])=>`<div class="item"><strong>${w}×${h}</strong><div class="frame" style="width:${w}px;height:${h}px"><iframe src="floating/${w}x${h}/index.html?static" width="${w}" height="${h}"></iframe></div></div>`).join('')</script></body></html>
