<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width={{WIDTH}},initial-scale=1">
  <meta name="ad.size" content="width={{WIDTH}},height={{HEIGHT}}">
  <title>Bantrab Connacionales · 3D Cube {{WIDTH}}×{{HEIGHT}}</title>
  <style>:root{--w:{{WIDTH}}px;--h:{{HEIGHT}}px}</style>
  <link rel="stylesheet" href="ad.css">
  <link rel="stylesheet" href="cube.css">
</head>
<body class="size-{{WIDTH}}x{{HEIGHT}}">
  <main class="cube-ad" aria-label="Tu bienestar también se construye a la distancia. Descárgala y crea tu cuenta con el apoyo de un asesor.">
    <div class="action" aria-label="YOLO. Conoce más aquí. Remesas Bantrab.">
      <img class="action-yolo" src="assets/yolo-logo.png" alt="YOLO">
      <img class="action-cta" src="assets/cta.png" alt="Conoce más aquí">
      <img class="action-brands" src="assets/bottom-logos.png" alt="Remesas Bantrab. Guatemaltecos hechos de valor.">
    </div>
    <div class="sheet ad">
      <img class="pinwheel" src="assets/pinwheel.png" alt="Bantrab">
      <img class="headline" src="assets/headline.png" alt="Tu bienestar también se construye a la distancia.">
      <img class="yolo" src="assets/yolo-logo.png" alt="YOLO">
      <img class="support" src="assets/support.png" alt="Descárgala y crea tu cuenta con el apoyo de un asesor.">
      <img class="brands" src="assets/bottom-logos.png" alt="Remesas Bantrab. Guatemaltecos hechos de valor.">
    </div>
    <div class="fold" aria-hidden="true"></div>
    <a class="click-area" href="https://www.bantrab.com/" target="_blank" rel="noopener noreferrer" aria-label="Conoce más aquí"></a>
  </main>
  <script>const face=new URLSearchParams(location.search).get('face');if(['action','front','mid'].includes(face))document.body.classList.add('show-'+face)</script>
</body>
</html>
