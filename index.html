<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
  <meta name="ad.size" content="width=1080,height=1920">
  <title>Tarjeta de Crédito Bantrab</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
    body { background: #222; font-family: Arial, Helvetica, sans-serif; }
    #ad { position: fixed; top: 50%; left: 50%; margin-top: -960px; margin-left: -540px; width: 1080px; height: 1920px; overflow: hidden; isolation: isolate; color: #fff; background: #c9dbe1; transform: scale(var(--ad-scale, .25)); transform-origin: center center; cursor: pointer; }
    .photo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center top; z-index: -2; }
    .shade { position: absolute; inset: 0; z-index: -1; background: linear-gradient(180deg, rgba(16,28,30,.19), transparent 35%, transparent 59%, rgba(7,17,22,.24) 70%, rgba(7,17,22,.67) 100%); }
    .frame { position: absolute; inset: 12px; border: 2px solid rgba(255,255,255,.9); pointer-events: none; }
    .headline { position: absolute; top: 310px; left: 0; width: 100%; text-align: center; text-shadow: 0 2px 5px #0004; animation: text-in .7s .12s both cubic-bezier(.16,1,.3,1); }
    .headline strong { display: block; font-size: 144px; line-height: .82; font-weight: 900; letter-spacing: -9px; }
    .headline span { display: block; font-size: 52px; line-height: 1.08; letter-spacing: -2px; }
    .offer { position: absolute; top: 1340px; left: 116px; width: 392px; text-align: center; text-shadow: 0 1px 3px #0008; animation: text-in .65s .56s both cubic-bezier(.16,1,.3,1); }
    .offer .main-line { display: block; white-space: nowrap; font-size: 36px; line-height: .98; letter-spacing: -1.9px; }
    .offer .main-line b { font-weight: 900; }
    .offer .benefit { display: block; margin-top: 12px; padding: 9px 11px 10px; background: #65c8d0; border-radius: 2px; font-size: 29px; line-height: .98; letter-spacing: -1.2px; }
    .cards { position: absolute; top: 1290px; left: 515px; width: 445px; height: 255px; perspective: 1100px; }
    .card { position: absolute; top: 0; width: 180px; height: 250px; opacity: 0; transform-style: preserve-3d; backface-visibility: visible; filter: drop-shadow(7px 11px 8px #0008); }
    .card svg { display: block; width: 100%; height: 100%; overflow: visible; }
    .card:nth-child(1) { left: 0; z-index: 3; animation: card-one 6.6s linear infinite; }
    .card:nth-child(2) { left: 132px; z-index: 2; animation: card-two 6.6s linear infinite; }
    .card:nth-child(3) { left: 265px; z-index: 1; animation: card-three 6.6s linear infinite; }
    .footer { position: absolute; top: 1640px; left: 0; width: 100%; display: flex; justify-content: center; align-items: center; gap: 26px; animation: text-in .65s .92s both cubic-bezier(.16,1,.3,1); }
    .footer .cta { font-size: 59px; letter-spacing: -3.5px; }
    .footer .divider { width: 2px; height: 116px; background: #fff; }
    .anniversary { display: flex; align-items: center; gap: 8px; }
    .anniversary .number { display: block; font-size: 95px; font-weight: 300; letter-spacing: -11px; line-height: 1; padding-right: 7px; }
    .anniversary .words { display: block; font-size: 30px; line-height: .95; }
    .anniversary .words small { display: block; font-size: 18px; letter-spacing: .2px; }
    @keyframes text-in { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
    /* Um cartão por vez; após o terceiro, os três somem juntos antes do próximo ciclo. */
    @keyframes card-one { 0%,9% { opacity:0;transform:rotateY(0) translateY(18px) } 14% { opacity:1;transform:rotateY(0) translateY(0) } 26%,74% { opacity:1;transform:rotateY(360deg) translateY(0) } 82%,100% { opacity:0;transform:rotateY(360deg) translateY(0) } }
    @keyframes card-two { 0%,28% { opacity:0;transform:rotateY(0) translateY(18px) } 33% { opacity:1;transform:rotateY(0) translateY(0) } 45%,74% { opacity:1;transform:rotateY(360deg) translateY(0) } 82%,100% { opacity:0;transform:rotateY(360deg) translateY(0) } }
    @keyframes card-three { 0%,47% { opacity:0;transform:rotateY(0) translateY(18px) } 52% { opacity:1;transform:rotateY(0) translateY(0) } 64%,74% { opacity:1;transform:rotateY(360deg) translateY(0) } 82%,100% { opacity:0;transform:rotateY(360deg) translateY(0) } }
    @media (prefers-reduced-motion: reduce) { .headline,.offer,.footer,.card { animation: none !important; opacity: 1; transform: none; } }
  </style>
</head>
<body>
  <main id="ad" role="link" tabindex="0" aria-label="Tarjeta de Crédito Bantrab">
  <img class="photo" src="mulher-compras-central-america.jpg" alt="Mulher negra latina sorrindo com cartão e sacolas de compras em uma rua comercial">
    <div class="shade" aria-hidden="true"></div><div class="frame" aria-hidden="true"></div>
    <div class="headline"><strong>TARJETA</strong><span>de Crédito Bantrab</span></div>
    <div class="offer"><span class="main-line"><b>TUYA</b> para llegar listo</span><span class="main-line">a la temporada de ofertas</span><span class="benefit">Cuotas sin intereses<br>desde el primer día.<br>Acumula puntos con<br>cada compra.</span></div>
    <div class="cards" aria-hidden="true">

      <div class="card"><svg viewBox="0 0 180 250" xmlns="http://www.w3.org/2000/svg"><rect width="180" height="250" rx="8" fill="#171b1b"/><rect x="2" y="2" width="176" height="246" rx="6" fill="none" stroke="#ffffff32"/><text x="12" y="22" fill="#eee" font-size="12" font-weight="700" font-family="Arial">bantrab</text><rect x="116" y="17" width="39" height="29" rx="5" fill="#b9b9aa"/><path d="M116 31h39M129 17v29M142 17v29" stroke="#ffffff55" stroke-width="1"/><g transform="translate(90 130)" fill="#83d1d4"><path d="M0-47L8-15 0-3-8-15Z"/><path d="M0-47L8-15 0-3-8-15Z" transform="rotate(45)"/><path d="M0-47L8-15 0-3-8-15Z" transform="rotate(90)"/><path d="M0-47L8-15 0-3-8-15Z" transform="rotate(135)"/><path d="M0-47L8-15 0-3-8-15Z" transform="rotate(180)"/><path d="M0-47L8-15 0-3-8-15Z" transform="rotate(225)"/><path d="M0-47L8-15 0-3-8-15Z" transform="rotate(270)"/><path d="M0-47L8-15 0-3-8-15Z" transform="rotate(315)"/></g><text x="90" y="229" fill="white" text-anchor="middle" font-size="25" font-style="italic" font-weight="900" font-family="Arial">VISA</text></svg></div>
    </div>
    <div class="footer"><span class="cta">Solicítala</span><span class="divider"></span><span class="anniversary"><span class="number">60</span><span class="words">años<small>BANTRAB</small></span></span></div>
  </main>
  <script>
    function fitAd() {
      const viewportWidth = document.documentElement.clientWidth || window.innerWidth;
      const viewportHeight = document.documentElement.clientHeight || window.innerHeight;
      const scale = Math.min(viewportWidth / 1080, viewportHeight / 1920);
      document.documentElement.style.setProperty('--ad-scale', String(scale));
    }
    fitAd();
    addEventListener('resize', fitAd);
    if (window.visualViewport) visualViewport.addEventListener('resize', fitAd);
    window.clickTag = window.clickTag || '';
    const ad = document.getElementById('ad');
    function openClickTag() { if (window.clickTag) window.open(window.clickTag, '_blank', 'noopener'); }
    ad.addEventListener('click', openClickTag);
    ad.addEventListener('keydown', event => { if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); openClickTag(); } });
  </script>
</body>
</html>
