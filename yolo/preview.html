<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bantrab · YoLo | Preview</title><style>:root{font-family:Arial,Helvetica,sans-serif;color:#f5f7f7;background:#101b20}*{box-sizing:border-box}body{margin:0}header{padding:28px clamp(18px,3vw,42px);border-bottom:1px solid #334247}h1{font-size:clamp(28px,3vw,44px);margin:0 0 8px}p{margin:0;color:#b8c5c5}main{padding:30px clamp(18px,3vw,42px)}h2{font-size:23px;margin:35px 0 16px}.grid{display:flex;flex-wrap:wrap;align-items:flex-start;gap:22px}.tile{background:#1b2b30;border:1px solid #334247;border-radius:10px;padding:12px}.tile strong{display:block;margin-bottom:10px}.frame{overflow:hidden}.tile a{display:inline-block;margin-top:10px;color:#63e4e0}</style></head><body><header><h1>YoLo · Rich Media</h1><p>Transfiero e Cobro · Floating Object e 3D Cube · 300×250, 400×300, 600×400</p></header><main id="list"></main><script>const base=location.pathname.startsWith('/p/')?'/yolo/':'./';const sizes=[[300,250],[400,300],[600,400]];document.getElementById('list').innerHTML=['transfiero','cobro'].map(variant=>`<section><h2>${variant==='transfiero'?'Transfiero — 4.psd':'Cobro — SLIDE 10YOLO.psd'}</h2><div class="grid">${['floating','cube'].flatMap(kind=>sizes.map(([w,h])=>`<div class="tile"><strong>${kind==='floating'?'Floating Object':'3D Cube'} · ${w}×${h}</strong><div class="frame"><iframe title="${variant} ${kind} ${w}×${h}" src="${base}${kind}/${variant}/${w}x${h}/index.html" width="${w}" height="${h}" style="border:0;display:block"></iframe></div><a href="${base}packages/bantrab-yolo-${variant}-${kind}-${w}x${h}.zip" download>Baixar ZIP</a></div>`)).join('')}</div></section>`).join('')</script></body></html>
